{% extends 'base.html' %}
{% block content %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
    }

    .auth-wrapper {
        display: flex;
        max-width: 1200px;
        width: 100%;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
    }

    .form-section {
        flex: 1;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .illustration-section {
        flex: 1;
        background: #ec4899;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        position: relative;
    }

    .illustration-section img {
        max-width: 80%;
        height: auto;
        position: relative;
        z-index: 2;
    }

    .illustration-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Person illustration */
    .person {
        width: 250px;
        height: 350px;
        position: relative;
    }

    .person-body {
        width: 180px;
        height: 200px;
        background: #2962ff;
        border-radius: 90px 90px 30px 30px;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
    }

    .person-head {
        width: 100px;
        height: 110px;
        background: #fdd5b8;
        border-radius: 50%;
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
    }

    .person-hair {
        width: 120px;
        height: 100px;
        background: #2c3e50;
        border-radius: 50% 50% 40% 40%;
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
    }

    .person-face-dot {
        width: 8px;
        height: 8px;
        background: #2c3e50;
        border-radius: 50%;
        position: absolute;
    }

    .eye-left {
        top: 50px;
        left: 30px;
    }

    .eye-right {
        top: 50px;
        right: 30px;
    }

    .person-smile {
        width: 30px;
        height: 15px;
        border: 2px solid #2c3e50;
        border-top: none;
        border-radius: 0 0 30px 30px;
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
    }

    .person-arm-left {
        width: 60px;
        height: 100px;
        background: #2962ff;
        border-radius: 30px;
        position: absolute;
        top: 180px;
        left: 20px;
        transform: rotate(-20deg);
    }

    .person-arm-right {
        width: 60px;
        height: 100px;
        background: #2962ff;
        border-radius: 30px;
        position: absolute;
        top: 180px;
        right: 20px;
        transform: rotate(20deg);
    }

    .clipboard {
        width: 80px;
        height: 100px;
        background: white;
        border-radius: 8px;
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%) rotate(-15deg);
        z-index: 3;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .clipboard-clip {
        width: 30px;
        height: 15px;
        background: #bbb;
        border-radius: 8px 8px 0 0;
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
    }

    .clipboard-lines {
        width: 50px;
        height: 3px;
        background: #ddd;
        margin: 8px auto;
        border-radius: 2px;
    }

    .clipboard-content {
        padding: 20px 15px;
    }

    .heart-icon {
        width: 50px;
        height: 50px;
        background: #2962ff;
        position: absolute;
        top: 100px;
        right: 80px;
        transform: rotate(-45deg);
        border-radius: 50% 50% 0 50%;
        z-index: 1;
    }

    .heart-icon::before {
        content: '';
        width: 50px;
        height: 50px;
        background: #2962ff;
        position: absolute;
        border-radius: 50%;
        top: -25px;
        left: 0;
    }

    .heart-icon::after {
        content: '';
        width: 50px;
        height: 50px;
        background: #2962ff;
        position: absolute;
        border-radius: 50%;
        top: 0;
        left: 25px;
    }

    .bottle-icon {
        width: 30px;
        height: 50px;
        background: white;
        border-radius: 8px;
        position: absolute;
        top: 180px;
        right: 60px;
        z-index: 1;
    }

    .bottle-cap {
        width: 20px;
        height: 15px;
        background: white;
        border-radius: 4px 4px 0 0;
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
    }

    .plant-leaf {
        width: 60px;
        height: 80px;
        background: rgba(38, 198, 218, 0.5);
        border-radius: 0 50% 50% 50%;
        position: absolute;
        bottom: 40px;
        right: 40px;
        transform: rotate(20deg);
    }

    .form-title {
        font-size: 36px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 40px;
    }

    .form-label {
        font-weight: 500;
        color: #555;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 15px;
        width: 100%;
        transition: all 0.3s;
        margin-bottom: 20px;
    }

    .form-control:focus {
        outline: none;
        border-color: #ec4899;
        box-shadow: 0 0 0 3px rgba(38, 198, 218, 0.1);
    }

    .form-control::placeholder {
        color: #bbb;
    }

    .checkbox-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .form-check {
        display: flex;
        align-items: center;
    }

    .form-check-input {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        cursor: pointer;
        accent-color: #ec4899;
    }

    .form-check-label {
        color: #555;
        cursor: pointer;
        font-size: 14px;
    }

    .forgot-link {
        color: #ec4899;
        text-decoration: none;
        font-size: 14px;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }

    .btn-login {
        background: #ec4899;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-login:hover {
        background: #00acc1;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(38, 198, 218, 0.3);
    }

    .signup-text {
        text-align: center;
        margin-top: 25px;
        color: #666;
        font-size: 14px;
    }

    .signup-link {
        color: #ec4899;
        text-decoration: none;
        font-weight: 600;
    }

    .signup-link:hover {
        text-decoration: underline;
    }

    /* Decorative elements */
    .decoration {
        position: absolute;
        border-radius: 50%;
        opacity: 0.3;
    }

    .decoration-1 {
        width: 100px;
        height: 100px;
        background: white;
        top: 10%;
        right: 10%;
    }

    .decoration-2 {
        width: 60px;
        height: 60px;
        background: white;
        bottom: 15%;
        left: 10%;
    }

    .decoration-3 {
        width: 40px;
        height: 40px;
        background: white;
        top: 50%;
        left: 5%;
    }

    #registerForm {
        display: none;
    }

    @media (max-width: 968px) {
        .auth-wrapper {
            flex-direction: column;
        }

        .illustration-section {
            order: -1;
            min-height: 300px;
        }

        .form-section {
            padding: 40px 30px;
        }
    }
</style>

<div class="auth-wrapper">
    <!-- Login Form -->
    <div id="loginForm" class="form-section">
        <h2 class="form-title">Login To Your Account!</h2>

        <form>
            <div>
                <input type="email" class="form-control" placeholder="Email" required>
            </div>

            <div>
                <input type="password" class="form-control" placeholder="Password" required>
            </div>

            <div class="checkbox-row">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember Me
                    </label>
                </div>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="signup-text">
            Not Registered Yet? <a href="#" class="signup-link" onclick="showRegister(); return false;">Sign-Up</a>
        </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="form-section">
        <h2 class="form-title">Create Your Account!</h2>

        <form>
            <div>
                <input type="text" class="form-control" placeholder="Full Name" required>
            </div>

            <div>
                <input type="email" class="form-control" placeholder="Email" required>
            </div>

            <div>
                <input type="tel" class="form-control" placeholder="Phone Number" required>
            </div>

            <div>
                <input type="password" class="form-control" placeholder="Password" required>
            </div>

            <div>
                <input type="password" class="form-control" placeholder="Confirm Password" required>
            </div>

            <div class="form-check" style="margin-bottom: 25px;">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label" for="termsCheck">
                    I agree to the <a href="#" class="signup-link">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn-login">Sign Up</button>
        </form>

        <div class="signup-text">
            Already have an account? <a href="#" class="signup-link" onclick="showLogin(); return false;">Login</a>
        </div>
    </div>

    <!-- Illustration Section -->
    <div class="illustration-section">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>

        <div class="illustration-container">
            <div class="person">
                <div class="person-hair"></div>
                <div class="person-head">
                    <div class="person-face-dot eye-left"></div>
                    <div class="person-face-dot eye-right"></div>
                    <div class="person-smile"></div>
                </div>
                <div class="person-body"></div>
                <div class="person-arm-left"></div>
                <div class="person-arm-right"></div>

                <div class="clipboard">
                    <div class="clipboard-clip"></div>
                    <div class="clipboard-content">
                        <div class="clipboard-lines"></div>
                        <div class="clipboard-lines"></div>
                        <div class="clipboard-lines"></div>
                    </div>
                </div>
            </div>

            <div class="heart-icon"></div>
            <div class="bottle-icon">
                <div class="bottle-cap"></div>
            </div>
            <div class="plant-leaf"></div>
        </div>
    </div>
</div>

<script>
    function showRegister() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
    }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
{% endblock %}
