<style>
    body {
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: "🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬  💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊 🎗️ 💗 🩺 🔬 💊";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        font-size: 40px;
        line-height: 80px;
        word-wrap: break-word;
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
    }

    .form-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }

    h2 {
        color: #ec4899;
        font-weight: 700;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2.5rem;
    }

    .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 0.9rem;
        text-transform: capitalize;
    }

    .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 12px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #ec4899;
        box-shadow: 0 0 0 0.2rem rgba(236, 72, 153, 0.25);
    }

    .btn-primary {
        background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
        border: none;
        padding: 15px 50px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1.1rem;
        transition: transform 0.2s ease;
        display: block;
        margin: 30px auto 0;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
    }

    #result {
        background: #fdf2f8;
        border-left: 4px solid #ec4899;
        padding: 20px;
        border-radius: 10px;
        margin-top: 30px;
        font-weight: 500;
        display: none;
    }

    #result.show {
        display: block;
        animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .section-title {
        color: #be185d;
        font-weight: 600;
        font-size: 1.3rem;
        margin-top: 30px;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #e0e0e0;
    }

    .section-title:first-of-type {
        margin-top: 0;
    }

    .info-badge {
        background: #fdf2f8;
        color: #be185d;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 0.9rem;
        margin-bottom: 20px;
        border-left: 4px solid #ec4899;
    }
</style>
<div class="container">
    <div class="form-container">
        <h2>🎗️ Breast Cancer Prediction</h2>

        <div class="info-badge">
            <strong>Note:</strong> Enter the mean values from cell nucleus measurements
        </div>

        <form id="cForm">
            <div class="section-title">Cell Nucleus Characteristics</div>
            <div class="row">
                <div class="mb-3 col-md-4">
                    <label class="form-label">Mean Radius</label>
                    <input name="mean radius" class="form-control" placeholder="Enter mean radius" type="number"
                        step="0.01" required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Mean Texture</label>
                    <input name="mean texture" class="form-control" placeholder="Enter mean texture" type="number"
                        step="0.01" required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Mean Perimeter</label>
                    <input name="mean perimeter" class="form-control" placeholder="Enter mean perimeter" type="number"
                        step="0.01" required>
                </div>
            </div>

            <div class="row">
                <div class="mb-3 col-md-4">
                    <label class="form-label">Mean Area</label>
                    <input name="mean area" class="form-control" placeholder="Enter mean area" type="number" step="0.01"
                        required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Mean Smoothness</label>
                    <input name="mean smoothness" class="form-control" placeholder="Enter mean smoothness" type="number"
                        step="0.0001" required>
                </div>
            </div>

            <button class="btn btn-primary" type="button" id="subBtn">Predict Cancer Risk</button>
        </form>

        <div id="result"></div>
    </div>
</div>

<script>
    document.getElementById('subBtn').addEventListener('click', async function () {
        const form = document.getElementById('cForm');
        const fd = new FormData(form);
        const obj = {};
        for (const [k, v] of fd.entries()) obj[k] = v;
        const res = await fetch('/predict/Cancer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
        const js = await res.json();
        const resultDiv = document.getElementById('result');
        let riskLabel = js.prediction === 1
            ? `<div class="alert alert-danger text-center" style="border-radius:15px;">
                    <strong>⚠️ High Risk Detected</strong><br>
                    The model predicts you may have <b>Diabetes</b>.
               </div>`
            : `<div class="alert alert-success text-center" style="border-radius:15px;">
                    <strong>✅ Low Risk</strong><br>
                    You are unlikely to have Diabetes.
               </div>`;

        // Probability calculation from js.proba
        let probability = (js.proba[1] * 100).toFixed(2);

        resultDiv.innerHTML = `
            <div class="card shadow-lg p-4 mt-4" style="border-radius:20px;">
                <h4 class="text-center">🔍 Prediction Result</h4>

                ${riskLabel}

                <h5 class="mt-3">📊 Probability Score</h5>
                <div class="progress" style="height:25px; border-radius:15px;">
                    <div class="progress-bar 
                        ${js.prediction === 1 ? 'bg-danger' : 'bg-success'}" 
                        role="progressbar"
                        style="width: ${probability}%; border-radius:15px;">
                        ${probability}%
                    </div>
                </div>

                <p class="text-muted mt-3 text-center">
                    This result is generated using our Hybrid Stacking AI (RF + GB + SVM → LR)
                </p>
            </div>
        `;

        resultDiv.classList.add('show');
    });
</script>
{% endblock %}
