{% extends 'base.html' %}
{% block content %}
<style>
    .form-container {
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    h2 {
        color: #ec4899;
        font-weight: 700;
        margin-bottom: 5px;
        text-align: center;
        font-size: 2.5rem;
    }

    .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #ec4899;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }

    .btn-primary {
        background: linear-gradient(135deg, #ec4899 0%, #cf85d4 100%);
        border: none;
        padding: 15px 50px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1.1rem;
        transition: transform 0.2s ease;
        display: block;
        margin: 30px auto 0;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    #result {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 10px;
        margin-top: 30px;
        font-weight: 500;
        display: none;
    }

    #result.show {
        display: block;
        animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .section-title {
        color: #ec4899;
        font-weight: 600;
        font-size: 1.3rem;
        margin-top: 10px;
        margin-bottom: 10px;
        padding-bottom: 5px;
        border-bottom: 2px solid #e0e0e0;
    }

    .section-title:first-of-type {
        margin-top: 0;
    }
</style>
<div class="container">
    <div class="form-container">
        <h2>❤️ Heart Disease Prediction</h2>

        <form id="heartForm">
            <div class="section-title">Personal Information</div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Gender (1 = Male, 0 = Female)</label>
                    <input name="male" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Age (Years)</label>
                    <input name="age" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Education Level (1–4)</label>
                    <input name="education" class="form-control" type="number" required>
                </div>
            </div>

            <div class="section-title">Lifestyle Factors</div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Current Smoker (1 = Yes, 0 = No)</label>
                    <input name="currentSmoker" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Cigarettes Per Day</label>
                    <input name="cigsPerDay" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">On BP Medication (1 = Yes, 0 = No)</label>
                    <input name="BPMeds" class="form-control" type="number" required>
                </div>
            </div>

            <div class="section-title">Medical History</div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Prevalent Stroke (1 = Yes, 0 = No)</label>
                    <input name="prevalentStroke" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Prevalent Hypertension (1 = Yes, 0 = No)</label>
                    <input name="prevalentHyp" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Diabetes (1 = Yes, 0 = No)</label>
                    <input name="diabetes" class="form-control" type="number" required>
                </div>
            </div>

            <div class="section-title">Clinical Measurements</div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Total Cholesterol (mg/dL)</label>
                    <input name="totChol" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Systolic Blood Pressure (mmHg)</label>
                    <input name="sysBP" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Diastolic Blood Pressure (mmHg)</label>
                    <input name="diaBP" class="form-control" type="number" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Body Mass Index (BMI)</label>
                    <input name="BMI" class="form-control" type="number" step="0.1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Heart Rate (bpm)</label>
                    <input name="heartRate" class="form-control" type="number" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Glucose Level (mg/dL)</label>
                    <input name="glucose" class="form-control" type="number" required>
                </div>
            </div>

            <button class="btn btn-primary" type="button" onclick="predictHeart()">Predict Risk</button>
        </form>

        <div id="result"></div>
    </div>
</div>

<script>
    async function predictHeart() {
        const fd = new FormData(document.getElementById("heartForm"));
        const data = {};
        for (const [k, v] of fd.entries()) data[k] = v;

        const res = await fetch("/predict/Heart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const out = await res.json();
        const resultDiv = document.getElementById("result");
        let riskLabel = out.prediction === 1
            ? `<div class="alert alert-danger text-center" style="border-radius:15px;">
         <strong>⚠️ High Risk Detected</strong><br>
         The model predicts you may have Heart Disease.
       </div>`
            : `<div class="alert alert-success text-center" style="border-radius:15px;">
         <strong>✅ Low Risk</strong><br>
         You are unlikely to have Heart Disease.
       </div>`;

        let probability = (out.proba[1] * 100).toFixed(2);

        resultDiv.innerHTML = `
    <div class="card shadow-lg p-4 mt-4" style="border-radius:20px;">
        <h4 class="text-center">🔍 Prediction Result</h4>
        
        ${riskLabel}

        <h5 class="mt-3">📊 Probability Score</h5>
        <div class="progress" style="height:25px; border-radius:15px;">
            <div class="progress-bar 
                ${out.prediction === 1 ? 'bg-danger' : 'bg-success'}" 
                role="progressbar"
                style="width: ${probability}%; border-radius:15px;">
                ${probability}%
            </div>
        </div>

        <p class="text-muted mt-3 text-center">
            This result is generated using our Hybrid Stacking AI (RF + GB + SVM → LR)
        </p>
    </div>
`;


        resultDiv.classList.add('show');
    }
</script>
{% endblock %}
