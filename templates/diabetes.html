{% extends 'base.html' %}
{% block content %}
<style>
    body {
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: "🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉  🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺 🩸 💉 🏥 💊 🩺";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        font-size: 40px;
        line-height: 80px;
        word-wrap: break-word;
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
    }

    .form-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }

    h2 {
        color: #ec4899;
        font-weight: 700;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2.5rem;
    }

    .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 12px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #ec4899;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }

    .btn-primary {
        background: linear-gradient(135deg, #ec4899 0%, rgb(171, 131, 180) 100%);
        border: none;
        padding: 15px 50px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1.1rem;
        transition: transform 0.2s ease;
        display: block;
        margin: 30px auto 0;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    #result {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 10px;
        margin-top: 30px;
        font-weight: 500;
        display: none;
    }

    #result.show {
        display: block;
        animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .section-title {
        color: #ec4899;
        font-weight: 600;
        font-size: 1.3rem;
        margin-top: 30px;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #e0e0e0;
    }

    .section-title:first-of-type {
        margin-top: 0;
    }
</style>
<div class="container">
    <div class="form-container">
        <h2>🩺 Diabetes Prediction</h2>

        <form id="diagForm" method="post" action="/predict/Diabetes">
            <div class="section-title">Patient Information</div>
            <div class="row">
                <div class="mb-3 col-md-4">
                    <label class="form-label">Pregnancies</label>
                    <input name="Pregnancies" class="form-control" placeholder="Enter Pregnancies" type="number"
                        required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Age</label>
                    <input name="Age" class="form-control" placeholder="Enter Age" type="number" required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">BMI</label>
                    <input name="BMI" class="form-control" placeholder="Enter BMI" type="number" step="0.1" required>
                </div>
            </div>

            <div class="section-title">Clinical Measurements</div>
            <div class="row">
                <div class="mb-3 col-md-4">
                    <label class="form-label">Glucose</label>
                    <input name="Glucose" class="form-control" placeholder="Enter Glucose" type="number" required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Blood Pressure</label>
                    <input name="BloodPressure" class="form-control" placeholder="Enter Blood Pressure" type="number"
                        required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Insulin</label>
                    <input name="Insulin" class="form-control" placeholder="Enter Insulin" type="number" required>
                </div>
            </div>

            <div class="row">
                <div class="mb-3 col-md-4">
                    <label class="form-label">Skin Thickness</label>
                    <input name="SkinThickness" class="form-control" placeholder="Enter Skin Thickness" type="number"
                        required>
                </div>
                <div class="mb-3 col-md-4">
                    <label class="form-label">Diabetes Pedigree Function</label>
                    <input name="DiabetesPedigreeFunction" class="form-control"
                        placeholder="Enter Diabetes Pedigree Function" type="number" step="0.001" required>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Predict Diabetes Risk</button>
        </form>

        <div id="result"></div>
    </div>
</div>

<script>
    document.getElementById('diagForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const fd = new FormData(this);
        const obj = {};
        for (const [k, v] of fd.entries()) obj[k] = v;

        const res = await fetch('/predict/Diabetes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(obj)
        });

        const js = await res.json();
        const resultDiv = document.getElementById('result');

        // ✅ FIXED: use js.prediction not out.prediction
        let riskLabel = js.prediction === 1
            ? `<div class="alert alert-danger text-center" style="border-radius:15px;">
                    <strong>⚠️ High Risk Detected</strong><br>
                    The model predicts you may have <b>Diabetes</b>.
               </div>`
            : `<div class="alert alert-success text-center" style="border-radius:15px;">
                    <strong>✅ Low Risk</strong><br>
                    You are unlikely to have Diabetes.
               </div>`;

        // Probability calculation from js.proba
        let probability = (js.proba[1] * 100).toFixed(2);

        resultDiv.innerHTML = `
            <div class="card shadow-lg p-4 mt-4" style="border-radius:20px;">
                <h4 class="text-center">🔍 Prediction Result</h4>

                ${riskLabel}

                <h5 class="mt-3">📊 Probability Score</h5>
                <div class="progress" style="height:25px; border-radius:15px;">
                    <div class="progress-bar 
                        ${js.prediction === 1 ? 'bg-danger' : 'bg-success'}" 
                        role="progressbar"
                        style="width: ${probability}%; border-radius:15px;">
                        ${probability}%
                    </div>
                </div>

                <p class="text-muted mt-3 text-center">
                    This result is generated using our Hybrid Stacking AI (RF + GB + SVM → LR)
                </p>
            </div>
        `;

        resultDiv.classList.add('show');
    });
</script>

{% endblock %}
